<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ponto Flex</title>
    <link rel="manifest" href='data:application/json,{"name":"Ponto Flex","short_name":"Ponto","start_url":"/","display":"standalone","background_color":"#ffffff"}'>
    <style>
        body { font-family: sans-serif; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        input { font-size: 1.5rem; padding: 10px; width: 100%; box-sizing: border-box; }
        .result { font-size: 1.2rem; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <label>Horário de Entrada:</label>
    <input type="time" id="entrada">
    
    <div class="result">Saída: <span id="saida">-</span></div>
    <div class="result">Limite: <span id="limite">-</span></div>

    <script>
        const input = document.getElementById('entrada');
        
        // Carrega salvo
        input.value = localStorage.getItem('entrada') || "";
        calcular();

        // Calcula ao mudar
        input.addEventListener('change', () => {
            localStorage.setItem('entrada', input.value);
            calcular();
            Notification.requestPermission();
        });

        function calcular() {
            if(!input.value) return;
            const [h, m] = input.value.split(':').map(Number);
            
            const saida = new Date(); saida.setHours(h + 9, m); // 9h de jornada
            const limite = new Date(); limite.setHours(h + 10, m); // 10h limite
            
            document.getElementById('saida').innerText = saida.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            document.getElementById('limite').innerText = limite.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            
            // Agenda alerta
            const agora = new Date();
            const tempoAteSaida = saida.getTime() - agora.getTime();
            if(tempoAteSaida > 0) {
                setTimeout(() => {
                    new Notification("Hora de vazar!", { body: "Sua jornada de trabalho terminou." });
                }, tempoAteSaida);
            }
        }
    </script>
</body>
</html>
