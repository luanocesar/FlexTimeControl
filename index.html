<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ponto Flex</title>
    <meta name="theme-color" content="#0f172a">
    
    <!-- Link para o arquivo manifest externo -->
    <link rel="manifest" href="manifest.json">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        input[type="time"]::-webkit-calendar-picker-indicator {
            background: transparent;
            bottom: 0;
            color: transparent;
            cursor: pointer;
            height: auto;
            left: 0;
            position: absolute;
            right: 0;
            top: 0;
            width: auto;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col antialiased overflow-hidden">

    <!-- Header -->
    <header class="flex items-center justify-between p-6 bg-slate-900/80 backdrop-blur-md pb-4">
        <div class="flex items-center gap-3">
            <i data-lucide="clock" class="w-8 h-8 text-sky-400"></i>
            <h1 class="text-3xl font-light tracking-wide text-white">Ponto<span class="font-bold text-sky-400">Flex</span></h1>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col px-6 pb-8 gap-8 justify-center">
        
        <!-- Entrada -->
        <div class="flex flex-col items-center justify-center bg-slate-800/50 rounded-3xl p-8 border border-slate-700/50 shadow-2xl relative">
            <label class="text-slate-400 font-medium tracking-widest uppercase text-sm mb-4 flex items-center gap-2">
                <i data-lucide="log-in" class="w-5 h-5 text-sky-400"></i> Horário de Entrada
            </label>
            <div class="relative w-full">
                <input 
                    type="time" 
                    id="entrada" 
                    class="w-full bg-transparent text-7xl md:text-8xl font-black text-center text-white focus:outline-none appearance-none relative z-10 cursor-pointer tracking-tighter"
                >
            </div>
            <div class="text-xs text-slate-500 mt-2">Inclui 1h de almoço</div>
        </div>

        <!-- Resultados -->
        <div class="flex flex-col gap-4">
            <div class="bg-emerald-500/10 border border-emerald-500/20 rounded-3xl p-6 flex items-center justify-between">
                <div class="flex items-center gap-3 text-emerald-400">
                    <i data-lucide="log-out" class="w-8 h-8"></i>
                    <span class="text-lg font-semibold uppercase tracking-wider">Saída Ideal</span>
                </div>
                <div id="saida" class="text-5xl font-black text-emerald-400">--:--</div>
            </div>
            
            <div class="bg-rose-500/10 border border-rose-500/20 rounded-3xl p-6 flex items-center justify-between">
                <div class="flex items-center gap-3 text-rose-400">
                    <i data-lucide="alert-octagon" class="w-8 h-8"></i>
                    <span class="text-lg font-semibold uppercase tracking-wider">Limite Max</span>
                </div>
                <div id="limite" class="text-5xl font-black text-rose-400">--:--</div>
            </div>
        </div>

        <div class="flex-1"></div>

        <!-- Botão Alarme transformado em Tag A para funcionar a Intent -->
        <a 
            id="btnAlarme" 
            href="#"
            class="w-full bg-sky-500 hover:bg-sky-400 active:bg-sky-600 text-slate-900 font-black text-xl py-6 rounded-3xl flex items-center justify-center gap-3 transition-all shadow-lg shadow-sky-500/20 opacity-30 cursor-not-allowed pointer-events-none"
        >
            <i data-lucide="bell-ring" class="w-7 h-7"></i>
            Ativar Alarme no Celular
        </a>

    </main>

    <script>
        lucide.createIcons();

        // Registra o Service Worker para habilitar a instalação do PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        const inputEntrada = document.getElementById('entrada');
        const spanSaida = document.getElementById('saida');
        const spanLimite = document.getElementById('limite');
        const btnAlarme = document.getElementById('btnAlarme');

        const salvo = localStorage.getItem('entrada');
        if (salvo) {
            inputEntrada.value = salvo;
            calcularHorarios();
        }

        inputEntrada.addEventListener('input', () => {
            if (inputEntrada.value) {
                localStorage.setItem('entrada', inputEntrada.value);
                calcularHorarios();
            }
        });

        function calcularHorarios() {
            if (!inputEntrada.value) return;

            const [h, m] = inputEntrada.value.split(':').map(Number);
            
            const dataSaida = new Date();
            dataSaida.setHours(h + 9, m + 48);
            
            const dataLimite = new Date(dataSaida.getTime());
            dataLimite.setMinutes(dataLimite.getMinutes() + 42);

            spanSaida.innerText = formatarHora(dataSaida);
            spanLimite.innerText = formatarHora(dataLimite);

            const hora = dataSaida.getHours();
            const minuto = dataSaida.getMinutes();

            // Atualiza a URL do botão com a Intent do Android
            btnAlarme.href = `intent://#Intent;action=android.intent.action.SET_ALARM;i.android.intent.extra.alarm.HOUR=${hora};i.android.intent.extra.alarm.MINUTES=${minuto};S.android.intent.extra.alarm.MESSAGE=Fim%20do%20Expediente;end`;
            
            // Habilita o botão
            btnAlarme.classList.remove('opacity-30', 'cursor-not-allowed', 'pointer-events-none');
        }

        function formatarHora(date) {
            return date.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }
    </script>
</body>
</html>
