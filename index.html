<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ponto Flex</title>
    <meta name="theme-color" content="#0f172a">
    
    <!-- Link para o arquivo manifest externo -->
    <link rel="manifest" href="manifest.json">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        input[type="time"]::-webkit-calendar-picker-indicator {
            background: transparent;
            bottom: 0;
            color: transparent;
            cursor: pointer;
            height: auto;
            left: 0;
            position: absolute;
            right: 0;
            top: 0;
            width: auto;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col antialiased overflow-hidden">

    <!-- Header -->
    <header class="flex items-center justify-between p-6 bg-slate-900/80 backdrop-blur-md pb-4">
        <div class="flex items-center gap-3">
            <i data-lucide="clock" class="w-8 h-8 text-sky-400"></i>
            <h1 class="text-3xl font-light tracking-wide text-white">Ponto<span class="font-bold text-sky-400">Flex</span></h1>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col px-6 pb-8 gap-8 justify-center">
        
        <!-- Entrada -->
        <div class="flex flex-col items-center justify-center bg-slate-800/50 rounded-3xl p-8 border border-slate-700/50 shadow-2xl relative">
            <label class="text-slate-400 font-medium tracking-widest uppercase text-sm mb-4 flex items-center gap-2">
                <i data-lucide="log-in" class="w-5 h-5 text-sky-400"></i> Horário de Entrada
            </label>
            <div class="relative w-full">
                <input 
                    type="time" 
                    id="entrada" 
                    class="w-full bg-transparent text-7xl md:text-8xl font-black text-center text-white focus:outline-none appearance-none relative z-10 cursor-pointer tracking-tighter"
                >
            </div>
            <div class="text-xs text-slate-500 mt-2">Inclui 1h de almoço</div>
        </div>

        <!-- Resultados -->
        <div class="flex flex-col gap-4">
            <div 
                id="containerSaida"
                class="bg-emerald-500/10 border border-emerald-500/20 rounded-3xl p-6 flex items-center justify-between cursor-pointer hover:bg-emerald-500/15 active:scale-[0.99] transition-all duration-200 group"
                title="Clique para copiar"
            >
                <div class="flex items-center gap-3 text-emerald-400">
                    <i data-lucide="log-out" class="w-8 h-8"></i>
                    <div>
                        <span class="text-sm font-semibold uppercase tracking-wider block opacity-75">Saída Ideal</span>
                        <span class="text-[10px] text-emerald-500/70 font-medium">Toque para copiar</span>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <div id="saida" class="text-5xl font-black text-emerald-400">--:--</div>
                    <i data-lucide="copy" class="w-5 h-5 text-emerald-500/30 group-hover:text-emerald-400 transition-colors"></i>
                </div>
            </div>
            
            <div 
                id="containerLimite"
                class="bg-rose-500/10 border border-rose-500/20 rounded-3xl p-6 flex items-center justify-between cursor-pointer hover:bg-rose-500/15 active:scale-[0.99] transition-all duration-200 group"
                title="Clique para copiar"
            >
                <div class="flex items-center gap-3 text-rose-400">
                    <i data-lucide="alert-octagon" class="w-8 h-8"></i>
                    <div>
                        <span class="text-sm font-semibold uppercase tracking-wider block opacity-75">Limite Max</span>
                        <span class="text-[10px] text-rose-500/70 font-medium">Toque para copiar</span>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <div id="limite" class="text-5xl font-black text-rose-400">--:--</div>
                    <i data-lucide="copy" class="w-5 h-5 text-rose-500/30 group-hover:text-rose-400 transition-colors"></i>
                </div>
            </div>
        </div>

        <div class="flex-1"></div>

        <!-- Ações -->
        <div class="flex flex-col gap-3">
            <a 
                id="btnAgenda" 
                href="#"
                target="_blank"
                class="w-full bg-sky-500 hover:bg-sky-400 active:bg-sky-650 text-slate-900 font-black text-lg py-5 rounded-3xl flex items-center justify-center gap-3 transition-all shadow-lg shadow-sky-500/20 opacity-30 cursor-not-allowed pointer-events-none"
            >
                <i data-lucide="calendar-plus" class="w-6 h-6"></i>
                Adicionar Lembrete na Agenda
            </a>
            
            <button 
                id="btnCopiar" 
                class="w-full bg-slate-800 hover:bg-slate-700 active:bg-slate-850 border border-slate-700/60 text-slate-100 font-bold text-base py-4 rounded-2xl flex items-center justify-center gap-2 transition-all opacity-30 cursor-not-allowed pointer-events-none"
            >
                <i data-lucide="copy" class="w-5 h-5 text-slate-400"></i>
                Copiar Saída Ideal
            </button>
        </div>

    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-slate-800 border border-sky-500/30 text-sky-400 px-6 py-3 rounded-full text-sm font-semibold shadow-2xl flex items-center gap-2 opacity-0 scale-95 pointer-events-none transition-all duration-300 z-50">
        <i data-lucide="check" class="w-4 h-4"></i>
        <span id="toastMsg">Copiado!</span>
    </div>

    <script>
        lucide.createIcons();

        // Registra o Service Worker para habilitar a instalação do PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        const inputEntrada = document.getElementById('entrada');
        const spanSaida = document.getElementById('saida');
        const spanLimite = document.getElementById('limite');
        const containerSaida = document.getElementById('containerSaida');
        const containerLimite = document.getElementById('containerLimite');
        const btnAgenda = document.getElementById('btnAgenda');
        const btnCopiar = document.getElementById('btnCopiar');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');

        let idealTimeStr = '';
        let limitTimeStr = '';

        const salvo = localStorage.getItem('entrada');
        if (salvo) {
            inputEntrada.value = salvo;
            calcularHorarios();
        }

        inputEntrada.addEventListener('input', () => {
            if (inputEntrada.value) {
                localStorage.setItem('entrada', inputEntrada.value);
                calcularHorarios();
            }
        });

        function showToast(message) {
            toastMsg.innerText = message;
            toast.classList.remove('opacity-0', 'scale-95', 'pointer-events-none');
            toast.classList.add('opacity-100', 'scale-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'scale-100');
                toast.classList.add('opacity-0', 'scale-95', 'pointer-events-none');
            }, 2500);
        }

        function copyToClipboard(text, label) {
            if (!text || text === '--:--') return;
            navigator.clipboard.writeText(text).then(() => {
                showToast(`${label} (${text}) copiado!`);
            }).catch(err => {
                console.error('Falha ao copiar: ', err);
            });
        }

        containerSaida.addEventListener('click', () => {
            if (idealTimeStr) copyToClipboard(idealTimeStr, 'Saída Ideal');
        });

        containerLimite.addEventListener('click', () => {
            if (limitTimeStr) copyToClipboard(limitTimeStr, 'Limite Máximo');
        });

        btnCopiar.addEventListener('click', () => {
            if (idealTimeStr) copyToClipboard(idealTimeStr, 'Saída Ideal');
        });

        function calcularHorarios() {
            if (!inputEntrada.value) return;

            const [h, m] = inputEntrada.value.split(':').map(Number);
            
            const dataSaida = new Date();
            dataSaida.setHours(h + 9, m + 48);
            
            const dataLimite = new Date(dataSaida.getTime());
            dataLimite.setMinutes(dataLimite.getMinutes() + 42);

            idealTimeStr = formatarHora(dataSaida);
            limitTimeStr = formatarHora(dataLimite);

            spanSaida.innerText = idealTimeStr;
            spanLimite.innerText = limitTimeStr;

            // Gerar URL do Google Calendar para Lembrete com Notificação
            const agora = new Date();
            const yyyy = agora.getFullYear();
            const mm = String(agora.getMonth() + 1).padStart(2, '0');
            const dd = String(agora.getDate()).padStart(2, '0');

            const formatarDataAgenda = (data) => {
                const horaStr = String(data.getHours()).padStart(2, '0');
                const minStr = String(data.getMinutes()).padStart(2, '0');
                return `${yyyy}${mm}${dd}T${horaStr}${minStr}00`;
            };

            const dataInicioStr = formatarDataAgenda(dataSaida);
            // Evento dura 5 minutos
            const dataFim = new Date(dataSaida.getTime() + 5 * 60 * 1000);
            const dataFimStr = formatarDataAgenda(dataFim);

            btnAgenda.href = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=Fim+do+Expediente+%F0%9F%9A%AA&dates=${dataInicioStr}/${dataFimStr}&details=Hor%C3%A1rio+de+sa%C3%ADda+ideal+calculado+pelo+PontoFlex.+Entrada+registrada+%C3%A0s+${inputEntrada.value}.&sf=true&output=xml`;

            // Habilita os botões
            btnAgenda.classList.remove('opacity-30', 'cursor-not-allowed', 'pointer-events-none');
            btnCopiar.classList.remove('opacity-30', 'cursor-not-allowed', 'pointer-events-none');
        }

        function formatarHora(date) {
            return date.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }
    </script>
</body>
</html>
